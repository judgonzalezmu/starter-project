[project]
name = "incidentops-starter"
version = "0.1.0"
description = "Proyecto semilla IncidentOps para Semana 1 de Ingeniería de Software Asistida por IA (ISIA)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "tiktoken>=0.8.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.0.0",
    "typer>=0.12.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "ruff>=0.17.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "TID"]
